<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 200px;
            width: 200px;
            background-color: beige;
            border: 2px solid black;
            position: relative;
            
        
        }
        .box1{
            width:50px;
            height: 50px;
            background-color: aqua;
            border: 2px solid black;
            position: absolute;
            top:10px;
            left:10px;
            z-index: 2px;
        }

        .box2{
            width:50px;
            height: 50px;
            background-color: rgb(189, 243, 109);
            border: 2px solid rgb(17, 13, 13);
            position:absolute;
            top:10px;
            left:30px;
            z-index: 2px;

            
        }
        .box3{
            width:50px;
            height: 50px;
            background-color: rgb(222, 85, 185);
            border: 2px solid black;
            position: absolute;
            top:20px;
            left:10px;
            z-index: 2px;
           
        }

        .container1{
            height: 500px;
            width:500px;
            justify-content: center;
            flex-direction:column;
            text-align: center;
            display: flex;
            background-color: blueviolet;
            
            
        }
        .item1{
            background-color: aqua;
            margin:10px;
            padding:10px;

        }
        .item2{
            background-color: aqua;
            margin:10px;
            padding:10px;
        }
        .item3{
            background-color: aqua;
            margin:10px;
            padding:10px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="box1">box1</div>
        <div class="box2">box2</div>
        <div class="box3">box3</div>
    </div>
    <nav>
    <div class="container1">
        <div class="item1">item1</div>
        <div class="item2">item2</div>
        <div class="item3">item3</div>

    </div>
    </nav>
</body>
</html>
